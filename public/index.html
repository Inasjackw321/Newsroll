<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsroll</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='7' fill='%23000'/><circle cx='16' cy='16' r='13' fill='none' stroke='%23000' stroke-opacity='.35' stroke-width='3'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Newsroll</h1>
    </div>
    <div class="topbar-actions">
      <span class="ai-pill" id="aiStatus" title="Local AI status">
        <span class="ai-dot"></span><span class="ai-label">Checking AI…</span>
      </span>
      <button class="icon-btn" id="refreshBtn" title="Refresh feeds" aria-label="Refresh feeds">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <!-- AI briefing -->
    <section class="card briefing" id="briefing">
      <div class="card-head">
        <div>
          <span class="eyebrow">✦ AI briefing</span>
          <h2 id="briefingTitle">Your daily summary</h2>
        </div>
        <div class="seg" role="tablist" aria-label="Briefing scope">
          <button role="tab" class="seg-btn active" data-scope="today">Today</button>
          <button role="tab" class="seg-btn" data-scope="since">Since last visit</button>
          <button role="tab" class="seg-btn" data-scope="topic">This topic</button>
        </div>
      </div>
      <div class="ai-output" id="briefingOut">
        <p class="muted">Get a quick AI-written rundown of the headlines, with links back to each story on the timeline.</p>
      </div>
      <div class="card-foot">
        <span class="muted small" id="briefingMeta"></span>
        <button class="btn ai" id="briefingBtn"><span class="spark">✦</span> Generate briefing</button>
      </div>
    </section>

    <!-- Ask -->
    <section class="card ask">
      <form id="askForm" autocomplete="off">
        <span class="ask-icon" aria-hidden="true">✦</span>
        <input id="askInput" type="text" placeholder="Ask about the news… e.g. “What's happening with the economy?”" maxlength="500" />
        <button class="btn ai" type="submit">Ask</button>
      </form>
      <div class="suggestions" id="suggestions"></div>
      <div class="ai-output answer hidden" id="askOut"></div>
    </section>

    <!-- Filters -->
    <nav class="filters" id="filters" aria-label="Topics"></nav>

    <div class="new-pill hidden" id="newPill" role="button" tabindex="0">↑ <span></span></div>

    <!-- Timeline -->
    <section class="timeline" id="timeline" aria-live="polite">
      <div class="now-marker"><span class="now-dot"></span><span>Now</span><span class="muted small" id="updated"></span></div>
      <div id="timelineBody"></div>
    </section>

    <p class="foot muted small" id="footNote"></p>
  </main>

  <template id="skeletonTpl">
    <div class="tl-item skeleton"><span class="tl-dot"></span><div class="tl-card"><div class="sk sk-meta"></div><div class="sk sk-title"></div></div></div>
  </template>

  <script src="app.js"></script>
</body>
</html>
