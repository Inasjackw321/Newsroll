<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Newsroll</title>
  <meta name="description" content="A simple news timeline with local AI summaries and answers." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Newsroll" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="appbar">
    <a class="brand" href="/" aria-label="Newsroll home">
      <svg class="logo" viewBox="20 24 60 52" aria-hidden="true"><path d="M24 72V28h10l16 28V28h10v44H50L34 44v28z"/><circle class="logo-dot" cx="70" cy="67" r="5"/></svg>
      <span class="wordmark">Newsroll</span>
    </a>
    <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <main class="wrap">
    <div class="masthead">
      <h1 id="greeting">Today</h1>
      <p class="muted" id="dateLine"></p>
    </div>

    <nav class="filters" id="filters" aria-label="Topics"></nav>

    <button class="summary-btn" id="summaryBtn">
      <span class="spark" aria-hidden="true">✦</span>
      <span class="summary-label" id="summaryLabel">Summarize today</span>
      <span class="summary-count muted" id="summaryCount"></span>
    </button>
    <div class="summary hidden" id="summaryBox">
      <button class="close-btn" id="summaryClose" aria-label="Close summary">×</button>
      <div class="ai-output"></div>
    </div>

    <section class="timeline" id="timeline" aria-live="polite">
      <div id="timelineBody"></div>
    </section>

    <p class="foot muted" id="footNote"></p>
  </main>

  <button class="new-pill hidden" id="newPill">↑ <span></span></button>

  <!-- Ask: bottom composer + slide-up sheet -->
  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" aria-label="Ask Newsroll" aria-hidden="true">
    <div class="sheet-head">
      <span class="sheet-title"><span class="spark">✦</span> Ask</span>
      <button class="close-btn" id="sheetClose" aria-label="Close">×</button>
    </div>
    <p class="ai-note hidden" id="aiNote"></p>
    <div class="thread" id="thread"></div>
    <div class="suggestions" id="suggestions"></div>
  </section>

  <form class="composer" id="askForm" autocomplete="off">
    <span class="composer-spark" id="aiSpark" aria-hidden="true">✦</span>
    <input id="askInput" type="text" placeholder="Ask about the news" maxlength="500" enterkeyhint="send" />
    <button class="send-btn" type="submit" aria-label="Ask">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
    </button>
  </form>

  <template id="skeletonTpl">
    <div class="tl-item skeleton"><span class="tl-dot"></span><div class="tl-card"><div class="sk sk-meta"></div><div class="sk sk-title"></div></div></div>
  </template>

  <script src="app.js"></script>
</body>
</html>
