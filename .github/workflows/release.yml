name: Build desktop app

# Builds the Mac, Windows and Linux installers and publishes them as a GitHub
# Release named after the version in package.json (e.g. v0.1.0).
# Runs when package.json changes on main (a release is only made if that
# version hasn't been released yet), from the Actions tab, or on a v* tag.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (untick to only build)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: newsroll-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.version.outputs.exists == 'true'
        run: echo "Release ${{ steps.version.outputs.tag }} already exists — bump the version in package.json to publish a new one."
      - if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Newsroll ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
